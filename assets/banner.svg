<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1933"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes pingDot {
        0% { r: 3; opacity: 1; }
        100% { r: 12; opacity: 0; }
      }
      .pulse-glow-1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 6s ease-in-out infinite;
      }
      .pulse-glow-2 {
        transform-origin: 1000px 320px;
        animation: pulseGlow 8s ease-in-out infinite 1s;
      }
      .floating-node-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatReverse 6s ease-in-out infinite 0.5s;
      }
      .stream-line {
        stroke-dasharray: 8 8;
        animation: dashMove 2s linear infinite;
      }
      .ping-circle {
        animation: pingDot 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="450" y1="0" x2="450" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="750" y1="0" x2="750" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1050" y1="0" x2="1050" y2="420"/>
  </g>

  <!-- Ambient Glowing Orbs (strictly background) -->
  <circle cx="200" cy="100" r="140" fill="#0284c7" filter="url(#glowFilter)" class="pulse-glow-1" />
  <circle cx="1000" cy="320" r="160" fill="#7c3aed" filter="url(#glowFilter)" class="pulse-glow-2" />

  <!-- Dynamic Network Interconnect Topology (Background & Periphery) -->
  <g opacity="0.35">
    <path d="M 120 320 C 300 240, 450 380, 600 320 S 900 260, 1080 340" fill="none" stroke="#0ea5e9" stroke-width="2" class="stream-line" />
    <path d="M 100 120 C 260 180, 400 60, 600 100 S 940 180, 1100 110" fill="none" stroke="#8b5cf6" stroke-width="2" class="stream-line" style="animation-duration: 3s;" />
  </g>

  <!-- Background Data Center Nodes & Ping Pulses (Sides) -->
  <g class="floating-node-1" opacity="0.85">
    <circle cx="110" cy="120" r="6" fill="#38bdf8"/>
    <circle cx="110" cy="120" r="6" fill="#38bdf8" class="ping-circle"/>
    <rect x="50" y="140" width="120" height="48" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" filter="url(#softShadow)"/>
    <text x="110" y="162" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REGION US-EAST</text>
    <text x="110" y="177" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">● 99.999% SLA</text>
  </g>

  <g class="floating-node-2" opacity="0.85">
    <circle cx="1090" cy="110" r="6" fill="#818cf8"/>
    <circle cx="1090" cy="110" r="6" fill="#818cf8" class="ping-circle" style="animation-delay: 1.1s;"/>
    <rect x="1030" y="130" width="120" height="48" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.3" filter="url(#softShadow)"/>
    <text x="1090" y="152" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REGION EU-CENTRAL</text>
    <text x="1090" y="167" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ ACTIVE-ACTIVE</text>
  </g>

  <!-- FOREGROUND HERO CONTENT (Guaranteed clean z-index & high contrast) -->
  <g id="heroForeground" filter="url(#softShadow)">
    <!-- Category Pill Badge -->
    <rect x="460" y="48" width="280" height="30" rx="15" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="1.5"/>
    <circle cx="478" cy="63" r="4.5" fill="#10b981"/>
    <text x="605" y="68" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">HIGH-AVAILABILITY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="135" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="44" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Global High-Availability
    </text>
    <text x="600" y="185" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
      Test Data Centers &amp; Chaos Labs
    </text>

    <!-- Subtitle -->
    <text x="600" y="228" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" text-anchor="middle">
      Curated Multi-Region Infrastructure, Hyperscale Colocation &amp; Self-Hosted Fault Injection
    </text>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(600, 310)">
      <!-- Pill 1: Multi-Region Cloud -->
      <g transform="translate(-370, 0)">
        <rect x="0" y="0" width="165" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="82" y="26" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Multi-Region AZs</text>
      </g>

      <!-- Pill 2: Chaos Engineering -->
      <g transform="translate(-190, 0)">
        <rect x="0" y="0" width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2"/>
        <text x="87" y="26" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💥 Chaos Engineering</text>
      </g>

      <!-- Pill 3: Failover Testing -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="175" height="42" rx="21" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2"/>
        <text x="87" y="26" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔄 Failover Validation</text>
      </g>

      <!-- Pill 4: Global Colocation -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2"/>
        <text x="90" y="26" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏢 Enterprise Colocation</text>
      </g>
    </g>
  </g>

  <!-- Border Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>
</svg>
